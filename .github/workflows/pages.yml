name: Deploy frontend to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'frontend_2/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend_2/package-lock.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        working-directory: frontend_2
        run: npm ci
      - name: Build
        working-directory: frontend_2
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [[ "$REPO_NAME" == *.github.io ]]; then export VITE_BASE_PATH=/; else export VITE_BASE_PATH="/$REPO_NAME/"; fi
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend_2/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

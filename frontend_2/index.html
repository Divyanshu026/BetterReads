<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f3e8" />
    <meta
      name="description"
      content="Discover books and find your next read with BetterReads."
    />
    <title>BetterReads — Good books. New beginnings.</title>
    <link rel="icon" type="image/png" href="%BASE_URL%betterreads-reader.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var route = params.get('__br_path');
        if (route && route.charAt(0) === '/' && route.charAt(1) !== '/') {
          var base = '%BASE_URL%'.replace(/\/$/, '');
          history.replaceState(null, '', base + route);
        }
      }());
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

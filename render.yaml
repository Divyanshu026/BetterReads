services:
  - type: web
    name: betterreads-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.12.0"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: FRONTEND_URL
        value: https://bettereads.dvyanshu.page
      - key: APP_URL
        value: https://bettereads.dvyanshu.page
      - key: FRONTEND_ORIGINS
        sync: false
      # Auth cookies are cross-site (SPA and API on different origins); leave
      # COOKIE_DOMAIN unset so cookies scope to the API host.
      - key: COOKIE_DOMAIN
        sync: false
      # Email (SMTP) via Brevo. Host/port/from are set here; add the Brevo login
      # as SMTP_USER and the generated SMTP key as SMTP_PASS in the dashboard
      # (secrets) BEFORE deploying. With MAIL_ENABLED=true but creds missing,
      # the app tries real SMTP, fails, and logs only an error (the verify link
      # is NOT printed) — registration still succeeds but no email is sent. The
      # console-log fallback only happens when MAIL_ENABLED is false.
      - key: MAIL_ENABLED
        value: "true"
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: BetterReads <no-reply@dvyanshu.page>
      # Google OAuth: set to light up Google sign-in (also needs VITE_GOOGLE_CLIENT_ID
      # in the frontend build and the prod origin in the Google Console).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
